name: probe
on:
  push:
    branches: [claude/homepage-photo-display-j1c0up]
    paths: [".github/workflows/probe.yml", "scripts/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: python3 scripts/update_activity.py
      - run: |
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data index.html tanaka_website/index.html
          git commit -m "Test run of activity updater" && git push || true
