name: probe
on:
  push:
    branches: [claude/homepage-photo-display-j1c0up]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq poppler-utils >/dev/null; which pdftotext
          B=https://www.city.chikushino.fukuoka.jp
          for id in 33496 34398 34392 33486 28723; do
            echo "=================== PDF $id"
            curl -sSL -m 120 $B/uploaded/attachment/$id.pdf -o a.pdf
            pdftotext -layout a.pdf a.txt
            head -45 a.txt | sed 's/  */ /g'
            echo "--- lines with 田中:"; grep -c '田中' a.txt; grep -n '田中' a.txt | head -8 | sed 's/  */ /g'
          done
          echo "=================== 2670"
          curl -sSL -A "Mozilla/5.0" -m 60 $B/soshiki/1/2670.html -o page.html
          python3 - <<'PY'
          import re,html
          s=open('page.html',encoding='utf-8',errors='replace').read()
          i=s.find('記事ID'); j=s.find('皆さまのご意見'); s=s[i:j]
          s=re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>','',s)
          t=html.unescape(re.sub(r'<[^>]+>','\n',s))
          print('\n'.join(l.strip() for l in t.split('\n') if l.strip())[:4000])
          PY
