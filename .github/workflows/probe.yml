name: probe
on:
  push:
    branches: [claude/homepage-photo-display-j1c0up]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          cat > dump.py <<'PY'
          import re,html,sys
          s=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          print('FORMS:',re.findall(r'(?is)<form[^>]*>',s)[:10])
          print('INPUTS:',re.findall(r'(?is)<(?:input|select)[^>]*name="([^"]*)"[^>]*>',s)[:40])
          s=re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>','',s)
          s=re.sub(r'(?is)<a [^>]*href="([^"]*)"[^>]*>',r' [\1] ',s)
          t=html.unescape(re.sub(r'<[^>]+>','\n',s))
          print('\n'.join(l.strip() for l in t.split('\n') if l.strip())[:int(sys.argv[2]) if len(sys.argv)>2 else 5000])
          PY
          get(){ echo "=================== $1"; curl -sSL -A "Mozilla/5.0" -m 60 -c jar -b jar "$1" -o p.html -w 'HTTP %{http_code} %{url_effective}\n'; python3 dump.py p.html ${2:-5000}; }
          D=https://www.city.chikushino.fukuoka.dbsr.jp
          get "$D/index.php/"
          get "$D/index.php/?Template=search-speaker" 
          C=https://www.city.chikushino.fukuoka.jp
          get "$C/soshiki/1/3958.html"
          get "$C/soshiki/1/2964.html" 8000
