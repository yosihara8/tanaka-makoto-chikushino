name: probe
on:
  push:
    branches: [claude/homepage-photo-display-j1c0up]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pages
        run: |
          UA="Mozilla/5.0"
          for u in "https://chikushino-city.stream.jfit.co.jp/?tpl=speaker_result&speaker_id=110" \
                   "https://www.city.chikushino.fukuoka.jp/site/gikai-2/" \
                   "https://www.city.chikushino.fukuoka.jp/soshiki/1/22740.html"; do
            echo "=================== $u"
            curl -sSL -A "$UA" -m 60 "$u" -o page.html -w 'HTTP %{http_code} %{size_download}\n'
            python3 - <<'PY'
          import re,html
          s=open('page.html',encoding='utf-8',errors='replace').read()
          s=re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>','',s)
          s=re.sub(r'(?is)<a [^>]*href="([^"]*)"[^>]*>',r' [\1] ',s)
          t=re.sub(r'<[^>]+>','\n',s); t=html.unescape(t)
          lines=[l.strip() for l in t.split('\n') if l.strip()]
          print('\n'.join(lines)[:15000])
          PY
          done
