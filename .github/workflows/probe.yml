name: probe
on:
  push:
    branches: [claude/homepage-photo-display-j1c0up]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq poppler-utils >/dev/null
          cat > dump.py <<'PY'
          import re,html,sys
          s=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          s=re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>','',s)
          s=re.sub(r'(?is)<a [^>]*href="([^"]*)"[^>]*>',r' [\1] ',s)
          t=html.unescape(re.sub(r'<[^>]+>','\n',s))
          L=[l.strip() for l in t.split('\n') if l.strip()]
          a=int(sys.argv[2]); n=int(sys.argv[3]) if len(sys.argv)>3 else 4000
          print('\n'.join(L)[a:a+n])
          PY
          D=https://www.city.chikushino.fukuoka.dbsr.jp
          curl -sSL -A "Mozilla/5.0" -m 60 -c jar -b jar "$D/index.php/" -o top.html; sleep 15
          ACT=$(grep -o 'action="/index.php/[0-9]*?Template=List"' top.html | head -1 | sed 's/action="//;s/"//')
          echo "######## 目次 search"
          curl -sSL -A "Mozilla/5.0" -m 90 -c jar -b jar "$D$ACT" --data-urlencode "Phrase=田中允" --data-urlencode "Cabinet[]=1" --data-urlencode "Class[]=1" --data-urlencode "TermStartYear=2010" --data-urlencode "TermEndYear=2010" --data-urlencode "QueryType=New" --data-urlencode "Template=List" -o res.html; sleep 15
          python3 dump.py res.html 150 1500
          SID=$(grep -o '/index.php/[0-9]*?Template=' res.html | head -1 | cut -d/ -f3 | cut -d'?' -f1)
          for ID in $(grep -o 'DocumentID=[0-9]*' res.html | cut -d= -f2 | sort -u | head -2); do
            echo "######## 目次 doc $ID"
            curl -sSL -A "Mozilla/5.0" -m 90 -c jar -b jar "$D/index.php/$SID?Template=view&VoiceType=all&DocumentID=$ID" -o v.html; sleep 15
            python3 - <<'PY'
          import re,html
          s=open('v.html',encoding='utf-8',errors='replace').read()
          s=re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>','',s)
          t=html.unescape(re.sub(r'<[^>]+>','\n',s))
          L=[l.strip() for l in t.split('\n') if l.strip()]
          print('\n'.join(L[:12]))
          for i,l in enumerate(L):
              if '田中' in l and '允' in l:
                  print('...'); print('\n'.join(L[max(0,i-2):i+12]))
          PY
          done
