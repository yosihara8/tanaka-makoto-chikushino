name: probe
on:
  push:
    branches: [claude/homepage-photo-display-j1c0up]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq poppler-utils >/dev/null
          cat > dump.py <<'PY'
          import re,html,sys
          s=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          s=re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>','',s)
          s=re.sub(r'(?is)<a [^>]*href="([^"]*)"[^>]*>',r' [\1] ',s)
          t=html.unescape(re.sub(r'<[^>]+>','\n',s))
          L=[l.strip() for l in t.split('\n') if l.strip()]
          a=int(sys.argv[2]); n=int(sys.argv[3]) if len(sys.argv)>3 else 4000
          print('\n'.join(L)[a:a+n])
          PY
          D=https://www.city.chikushino.fukuoka.dbsr.jp
          curl -sSL -A "Mozilla/5.0" -m 60 -c jar -b jar "$D/index.php/" -o top.html; sleep 15
          ACT=$(grep -o 'action="/index.php/[0-9]*?Template=List"' top.html | head -1 | sed 's/action="//;s/"//')
          for Y in 2006 2012 2018; do
          echo "######## speeches $Y"
          curl -sSL -A "Mozilla/5.0" -m 90 -c jar -b jar "$D$ACT" --data-urlencode "optionsSpeakers=on" --data-urlencode "SpeakerName[]=31" --data-urlencode "Cabinet[]=1" --data-urlencode "Class[]=3" --data-urlencode "TermStartYear=$Y" --data-urlencode "TermEndYear=$Y" --data-urlencode "QueryType=New" --data-urlencode "Template=List" -o res.html; sleep 20
          python3 - <<'PY'
          import re,html
          s=open('res.html',encoding='utf-8',errors='replace').read()
          s=re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>','',s)
          t=html.unescape(re.sub(r'<[^>]+>','\n',s))
          L=[l.strip() for l in t.split('\n') if l.strip()]
          out=[l for l in L if ('定例会' in l and '本文' in l) or l.startswith('...◯')]
          print('\n'.join(x[:260] for x in out[:60]))
          PY
          done
          echo "######## permalink test (fresh jar)"
          curl -sSL -A "Mozilla/5.0" -m 60 "$D/index.php/?Template=view&VoiceType=all&DocumentID=325" -o pl.html -w 'HTTP %{http_code}\n'; grep -o '<title>[^<]*' pl.html
