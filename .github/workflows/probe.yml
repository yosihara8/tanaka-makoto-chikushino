name: probe
on:
  push:
    branches: [claude/homepage-photo-display-j1c0up]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pages
        run: |
          which pdftotext || echo "no pdftotext"
          B=https://www.city.chikushino.fukuoka.jp
          for u in $B/soshiki/1/23086.html $B/soshiki/1/30311.html $B/soshiki/1/2675.html $B/soshiki/1/1520.html; do
            echo "=================== $u"
            curl -sSL -A "Mozilla/5.0" -m 60 "$u" -o page.html -w 'HTTP %{http_code}\n'
            python3 - <<'PY'
          import re,html
          s=open('page.html',encoding='utf-8',errors='replace').read()
          i=s.find('記事ID'); j=s.find('皆さまのご意見')
          s=s[i:j] if i>0 and j>i else s
          s=re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>','',s)
          s=re.sub(r'(?is)<a [^>]*href="([^"]*)"[^>]*>',r' [\1] ',s)
          t=html.unescape(re.sub(r'<[^>]+>','\n',s))
          print('\n'.join(l.strip() for l in t.split('\n') if l.strip())[:6000])
          PY
          done
          echo "=================== PDF 33496"
          curl -sSL -m 60 $B/uploaded/attachment/33496.pdf -o a.pdf -w 'HTTP %{http_code}\n'
          pdftotext -layout a.pdf a.txt && head -60 a.txt && grep -n '田中' a.txt | head -20
