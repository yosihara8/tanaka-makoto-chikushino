name: 議会活動の自動更新

on:
  schedule:
    - cron: "13 0 * * 1"  # 毎週月曜 9:13（日本時間）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch activity from Chikushino city sites
        run: python3 scripts/update_activity.py
      - name: Commit and push
        run: |
          if git diff --quiet; then echo "変更なし"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data index.html tanaka_website/index.html
          git commit -m "議会活動を自動更新"
          git push
